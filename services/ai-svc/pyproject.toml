[project]
name = "copilot"
version = "0.1.0"
description = "Industrial troubleshooting copilot - AI service and tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.1",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "tzdata>=2024.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
copilot = "copilot.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
# optional cross-encoder for strategy=hybrid_rerank; pulls torch, so the container image and CI leave it out
rerank = ["sentence-transformers>=3.0"]

[tool.uv]
default-groups = ["dev", "rerank"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = ["integration: needs the docker compose Postgres (run with -m integration)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# explicit, so a ruff upgrade does not change what CI enforces
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]  # typer.Option(...) defaults are the idiom; zip() inputs are equal-length by construction
