<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incident copilot</title>
  <meta name="description" content="ind-agent: read-only incident investigation over synthetic plant data">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/chart.umd.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="brand-name">ind-agent</span>
      <span class="brand-sub">Incident copilot</span>
    </div>
    <div class="controls">
      <label class="field" id="tenant-field">
        <span>Plant</span>
        <select id="tenant"></select>
      </label>
      <label class="field hidden" id="token-field">
        <span>Access token</span>
        <input id="token" type="password" autocomplete="off" placeholder="paste a token">
      </label>
      <label class="field">
        <span>Report writer</span>
        <select id="mode">
          <option value="template">Evidence only (instant)</option>
          <option value="llm">Language model (about a minute)</option>
        </select>
      </label>
      <label class="field">
        <span>As of</span>
        <input id="as-of" type="text" spellcheck="false" placeholder="2026-10-17T12:52:00Z" aria-describedby="as-of-hint">
        <span id="as-of-hint" class="visually-hidden">ISO 8601 date and time with a time zone, for example 2026-10-17T12:52:00Z</span>
      </label>
    </div>
    <span class="synthetic" title="All plant data in this demo is generated by a simulator">Synthetic data</span>
  </header>

  <main>
    <form id="ask" class="ask">
      <label for="question" class="visually-hidden">Question</label>
      <textarea id="question" rows="2" maxlength="1000" placeholder="Investigate yesterday's temperature alarm on Pump 12"></textarea>
      <button id="submit" type="submit">Investigate</button>
      <div id="examples" class="examples" aria-label="Example questions"></div>
    </form>

    <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
    <section id="result" class="result hidden" aria-live="polite"></section>
    <p id="empty" class="empty">Ask about an alarm on one of your assets. The copilot reads alarm history and sensor readings, matches known fault patterns and cites the maintenance procedure it relies on. It never changes equipment settings.</p>
  </main>
</body>
</html>
