name: ind-agent

# Development: `docker compose up -d` starts Postgres and data-svc; ai-svc runs from the host with uv.
# One-command demo: `docker compose --profile demo up -d --build` also migrates, generates data, ingests the
# corpus and serves the UI on http://127.0.0.1:8000. Ollama runs on the host (see docs/deployment.md).

x-ai-env: &ai-env
  COPILOT_PG_HOST: postgres
  COPILOT_PG_PORT: "5432"
  COPILOT_DATA_SVC_URL: http://data-svc:8081
  COPILOT_OLLAMA_URL: ${COPILOT_OLLAMA_URL:-http://host.docker.internal:11434}
  COPILOT_LLM_MODEL: ${COPILOT_LLM_MODEL:-qwen2.5:3b-instruct}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${COPILOT_OWNER_PASSWORD:-owner_dev_pw}
      POSTGRES_DB: indagent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d indagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  data-svc:
    build: ./services/data-svc
    restart: unless-stopped  # survives starting before `copilot migrate` creates its role
    environment:
      DATASVC_ADDR: ":8081"
      DATASVC_DB_DSN: "host=postgres port=5432 dbname=indagent user=ops_reader password=${COPILOT_OPS_READER_PASSWORD:-ops_reader_dev_pw}"
      COPILOT_JWT_SECRET: ${COPILOT_JWT_SECRET:?set COPILOT_JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/data-svc", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  # demo profile ----------------------------------------------------------------------------------------
  init:  # one-shot: migrations, 30 days of synthetic data (once per volume), corpus ingest (idempotent)
    profiles: ["demo"]
    image: ind-agent/ai-svc:dev
    build: &ai-build
      context: .
      dockerfile: services/ai-svc/Dockerfile
    env_file: [.env]
    environment: *ai-env
    command: ["sh", "-c", "copilot migrate && (test -f /app/data/simgen_run.json || copilot simgen) && copilot ingest"]
    volumes:
      - copilot-data:/app/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres:
        condition: service_healthy

  ai-svc:
    profiles: ["demo"]
    image: ind-agent/ai-svc:dev
    build: *ai-build
    restart: unless-stopped
    env_file: [.env]
    environment: *ai-env
    # --dev-docker mints demo tokens for the Docker gateway (the host); safe only because the port is published
    # on the host's loopback
    command: ["copilot", "serve", "--dev-docker"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - copilot-data:/app/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      init:
        condition: service_completed_successfully
      data-svc:
        condition: service_healthy

volumes:
  pgdata:
  copilot-data:
